<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime By Allrounder</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: #000;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

.shaka-video-container {
  position: absolute;
  inset: 0;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

/* Hide loader */
.shaka-spinner-container,
.shaka-spinner {
  display: none !important;
}
</style>
</head>

<body>

<div class="shaka-video-container" data-shaka-player>
  <video autoplay playsinline muted controls></video>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {

  const video = document.querySelector('video');
  const streamUrl = "https://pslurdu.bigbaat.app/out/v1/0ef369b90c7b4025b76621e46ee5fb70/index_1.m3u8";

  // 🔹 First Click Ad Logic
  let firstClick = true;

  function handleFirstClick() {
    if (firstClick) {
      firstClick = false;
      window.open("https://offstump.com", "_blank");
    }
  }

  document.body.addEventListener("click", handleFirstClick);

  // ✅ Native HLS (iOS / Safari)
  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = streamUrl;

    video.addEventListener('loadedmetadata', () => {
      video.play().catch(()=>{});
    });

    return;
  }

  // ✅ Shaka for other browsers
  shaka.polyfill.installAll();

  if (!shaka.Player.isBrowserSupported()) {
    alert("Browser not supported");
    return;
  }

  const player = new shaka.Player(video);

  const container = document.querySelector('.shaka-video-container');
  const ui = new shaka.ui.Overlay(player, container, video);

  ui.configure({
    controlPanelElements: [
      'play_pause','time_and_duration','mute','volume',
      'spacer','quality','fullscreen'
    ]
  });

  player.configure({
    streaming: {
      lowLatencyMode: true,
      bufferingGoal: 20,
      rebufferingGoal: 2,
      bufferBehind: 15
    }
  });

  player.addEventListener('error', e => console.log("Shaka Error:", e));

  try {
    await player.load(streamUrl);
    console.log("Stream working ✅");

    video.muted = true;
    await video.play();

  } catch (e) {
    console.log("Shaka failed → fallback");

    // 🔥 fallback to native
    video.src = streamUrl;
    video.play().catch(()=>{});
  }

});
</script>

</body>
</html>
